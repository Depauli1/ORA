# ORA continuous integration (8 jobs): Hardhat suite + Slither + Foundry
# invariants + oracle prod-config gate + Base Sepolia fork reads + keeper
# scan load test + Tier-3 coverage gate + frontend (typecheck, build,
# vitest, Playwright e2e). The Slither gate classifies findings by tier:
# Tier 3 (new ORA code) fails on high severity; Tier 2 (forks of audited
# Liquity code — the fork-kill-zone) fails on high unless the finding is
# mechanically PROVEN inherited from an audited base file and triaged, and
# fails on medium unless triaged in scripts/slither-triage.json. The audited
# upstream core (Tier 0/1) is reported informationally.
name: CI

on:
  push:
    branches: ["arena/01a0d2bf-ora", "arena/01a0d469-ora"]
    paths-ignore:
      - "ora-mvp/.deploy-testnet-trigger"
      - "ora-mvp/app/deployment-baseSepolia.json"
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Hardhat test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ora-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ora-mvp/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - name: Contract-size gate (fails over 22KB)
        run: node scripts/check-sizes.js
      - name: Gas snapshot check (fails on >10% regression)
        run: GAS_CHECK=1 npx hardhat run scripts/gas-snapshot.js
      - name: Run test suite
        run: npx hardhat test

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ora-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ora-mvp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: pip install slither-analyzer
      - run: npx hardhat compile
      - name: Full report (informational, never fails)
        run: |
          slither . --ignore-compile --compile-force-framework Hardhat --checklist --no-fail-pedantic > ../slither-full-report.md 2> ../slither-full-stderr.txt || true
          {
            echo "## Slither — full report (informational)"
            echo "<details><summary>expand</summary>"
            echo
            head -c 60000 ../slither-full-report.md
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Tier gate — T3 high fails; T2 (audited-code forks) high fails unless provably inherited from an audited base, medium must be triaged (scripts/slither-triage.json)"
        run: |
          slither . --ignore-compile --compile-force-framework Hardhat --json slither-all.json \
            || true
          node scripts/slither-gate.js slither-all.json
      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: |
            slither-full-report.md
            slither-full-stderr.txt

  foundry:
    name: Foundry invariant tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ora-mvp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Invariant suites (WTBill custody, sorUSD backing)
        run: forge test

  oracle-config:
    name: Oracle prod-config gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ora-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail closed on single-source prod config
        run: node scripts/check-oracle-config.js

  fork:
    name: Fork tests (Base Sepolia)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ora-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ora-mvp/package-lock.json
      - run: npm ci
      - name: Fork reads against live Base Sepolia state
        run: npx hardhat test test/fork-reads.test.js
        env:
          ORA_FORK_URL: ${{ secrets.ORA_FORK_RPC_URL || 'https://sepolia.base.org' }}

  keeper-load:
    name: Keeper scan load test (500 troves)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ora-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ora-mvp/package-lock.json
      - run: npm ci
      - name: Scan path at depth (fails if the cursor misses troves)
        run: npx hardhat run scripts/loadtest-keeper-scan.js
        env:
          SCAN_N: "500"

  coverage:
    name: Coverage gate (Tier 3 >= 85%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ora-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ora-mvp/package-lock.json
      - run: npm ci
      - name: Tier-3 line coverage gate
        run: npm run coverage
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  frontend:
    name: Frontend (typecheck, build, vitest, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ora-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ora-mvp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: Vitest (server + UI suites)
        run: npx vitest run app/test/
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (fresh chain + deploy + app server)
        run: npx playwright test
        env:
          CI: "true"
